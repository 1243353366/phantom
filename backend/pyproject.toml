[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-privacy"
version = "0.2.0"
description = "Privacy intelligence and relationship mapping. Local-first, metadata-first, provenance-required."
readme = { text = """
Privacy intelligence and relationship mapping. See the ecosystem that sees you.

PHANTOM reads message metadata you authorise, identifies the infrastructure
positioned to observe you, and draws the relationships with the evidence for each
one and the uncertainty made explicit. Local-first, metadata-first, and every edge
carries provenance.

Full documentation lives at the repository root.
""", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
keywords = ["privacy", "email", "tracking", "graph", "osint", "counterintelligence"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "networkx>=3.2",
  "httpx>=0.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
postgres = ["psycopg[binary]>=3.1"]
google = ["google-auth>=2.28", "google-auth-oauthlib>=1.2"]

[project.scripts]
phantom = "phantom.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phantom*"]

[tool.setuptools.package-data]
phantom = ["registry/data/*.yaml", "selfaudit/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# 120 rather than 100: the rule tables and evidence payloads in engine/ read worse
# wrapped. Long-line detection still runs, so a genuinely unwieldy line is caught.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",  # assert is the right tool in tests and in invariant checks
  "B008",  # Depends(...) in a signature default is how FastAPI declares dependencies
  "S104",  # the API binds 0.0.0.0 inside the container; that is the deployment shape
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures build plausible secrets and hosts on purpose.
"tests/*" = ["S105", "S106", "S107", "S108"]
