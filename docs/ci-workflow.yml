# PHANTOM CI
#
# This file sits at docs/ci-workflow.yml rather than .github/workflows/ci.yml
# because pushing into .github/workflows requires the GitHub OAuth `workflow`
# scope, which the publishing connection does not hold. The definition is
# complete and unmodified; only its location is provisional.
#
# To activate it, either:
#   git mv docs/ci-workflow.yml .github/workflows/ci.yml   (with `workflow` scope)
# or paste it into .github/workflows/ci.yml through the GitHub web UI, which
# needs no token scope at all.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint
        run: ruff check backend
      - name: Test
        run: cd backend && pytest -q

      # The pipeline is the product; if the demo cannot run, nothing else matters.
      - name: Demo pipeline
        run: |
          cd backend
          python -m phantom.cli demo --samples-dir ../samples --out ../out
          python -m phantom.cli mirror-demo --out ../out
          python -m phantom.cli shadow-demo --out ../out
          python -m phantom.cli vault-verify

      # These invariants are the project's promises. Fail the build, not the review.
      - name: Invariants
        run: |
          cd backend
          python - <<'PY'
          import json, pathlib, sys

          report = json.loads(pathlib.Path("../out/report.md").exists() and
                              pathlib.Path("../out/selfaudit.json").read_text() or "{}")
          assert report.get("unmediated_egress_found") == 0, "an unaudited egress path exists"

          counter = json.loads(pathlib.Path("../out/counter-report.json").read_text())
          assert counter["guardrails"]["retaliation_enabled"] is False
          assert counter["guardrails"]["raw_ip_retained"] is False

          graph = json.loads(pathlib.Path("../out/graph.json").read_text())
          for element in graph["elements"]:
              data = element["data"]
              if "relation" in data:
                  assert data["evidence_count"] >= 1, f"edge without provenance: {data['id']}"
                  if data["classification"] == "hypothesized":
                      assert data["confidence"] <= 0.65, f"hypothesis over-claimed: {data['id']}"

          shadow = json.loads(pathlib.Path("../out/shadow-report.json").read_text())
          assert shadow["vault"]["ok"] is True, "evidence chain does not verify"
          g = shadow["guardrails"]
          assert g["automatic_layer_merges"] == 0, "the layers merged without a human"
          assert g["active_probing_of_third_parties"] is False
          assert g["recovered_credentials_stored"] is False
          assert g["quarantined_payloads_executed"] is False
          for event in shadow["protected_objects_touched"]:
              pass  # every event carries alt_explanations; enforced at write time

          view = json.loads(pathlib.Path("../out/shadow-graph.json").read_text())
          assert view["separation"]["automatic_merges"] == 0
          for element in view["elements"]:
              data = element["data"]
              if data.get("cross_layer"):
                  assert data["classification"] == "hypothesized"
                  assert data["confidence"] <= 0.65
          print("invariants hold")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build
