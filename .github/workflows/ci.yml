# PHANTOM CI
#
# Two jobs, and the second one is the point. Tests can pass while the project's
# promises quietly stop being true, so the invariants job fails the build on the
# promises themselves: no unaudited egress, no retaliation, no over-claimed
# hypothesis, no silent layer merge, no unverifiable evidence chain, and a graph
# that can still be re-derived from its observations.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint
        run: ruff check backend
      - name: Test
        run: cd backend && pytest -q

      # The pipeline is the product; if the demo cannot run, nothing else matters.
      - name: Demo pipeline
        run: |
          cd backend
          python -m phantom.cli demo --samples-dir ../samples --out ../out
          python -m phantom.cli mirror-demo --out ../out
          python -m phantom.cli shadow-demo --out ../out
          python -m phantom.cli vault-verify

      - name: Invariants
        run: |
          cd backend
          python - <<'PY'
          import json
          import pathlib

          audit = json.loads(pathlib.Path("../out/selfaudit.json").read_text())
          assert audit["unmediated_egress_found"] == 0, "an unaudited egress path exists"

          counter = json.loads(pathlib.Path("../out/counter-report.json").read_text())
          assert counter["guardrails"]["retaliation_enabled"] is False
          assert counter["guardrails"]["raw_ip_retained"] is False

          graph = json.loads(pathlib.Path("../out/graph.json").read_text())
          for element in graph["elements"]:
              data = element["data"]
              if "relation" in data:
                  assert data["evidence_count"] >= 1, f"edge without provenance: {data['id']}"
                  if data["classification"] == "hypothesized":
                      assert data["confidence"] <= 0.65, f"hypothesis over-claimed: {data['id']}"

          shadow = json.loads(pathlib.Path("../out/shadow-report.json").read_text())
          assert shadow["vault"]["ok"] is True, "evidence chain does not verify"
          guardrails = shadow["guardrails"]
          assert guardrails["automatic_layer_merges"] == 0, "the layers merged without a human"
          assert guardrails["active_probing_of_third_parties"] is False
          assert guardrails["recovered_credentials_stored"] is False
          assert guardrails["quarantined_payloads_executed"] is False

          view = json.loads(pathlib.Path("../out/shadow-graph.json").read_text())
          assert view["separation"]["automatic_merges"] == 0
          for element in view["elements"]:
              data = element["data"]
              if data.get("cross_layer"):
                  assert data["classification"] == "hypothesized"
                  assert data["confidence"] <= 0.65
                  assert data["evidence_count"] >= 1
          print("invariants hold")
          PY

      # The graph is a set of claims. If they cannot be re-derived from the
      # observations that produced them, someone is looking at conclusions whose
      # reasoning no longer exists.
      - name: Graph must be re-derivable
        run: |
          cd backend
          python -m phantom.cli rebuild-graph | tee rebuild.txt
          grep -q "graph reproduced:  yes" rebuild.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build
